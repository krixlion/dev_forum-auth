apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: mongodb
spec:
  members: 1
  type: ReplicaSet
  version: "8.0.0"
  featureCompatibilityVersion: "8.0"
  security:
    authentication:
      modes: ["SCRAM"]
  users:
    - name: admin
      db: auth-service
      connectionStringSecretName: mongodb-admin-uri
      scramCredentialsSecretName: mongodb-admin
      passwordSecretRef: # a reference to the secret that will be used to generate the user's password
        name: mongodb-secret
      roles:
        - name: "dbOwner"
          db: "auth-service"
  additionalMongodConfig:
    storage.wiredTiger.engineConfig.journalCompressor: zlib
---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
type: Opaque
stringData:
  password: 96ZWNQpUr9AmNaH
